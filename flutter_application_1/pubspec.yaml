name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  image_picker: ^1.2.1
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  firebase_storage: ^13.1.0
  firebase_database: ^12.1.4
  timeago: ^3.7.1
  google_fonts: ^8.0.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  file_picker: ^10.3.10
  firebase_app_check: ^0.4.1+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 🌟 ఐకాన్ కోసం ప్యాకేజీ ఇక్కడ యాడ్ చేశాం
  flutter_launcher_icons: ^0.13.1

# 🌟 మన కొత్త లోగో సెట్టింగ్స్ ఇక్కడ ఉన్నాయి
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  # 🌟 అసెట్స్ ఫోల్డర్ పర్మిషన్ ఇక్కడ ఇస్తున్నాం (లోగో లోడ్ అవ్వడానికి ఇది ముఖ్యం)
  assets:
    - assets/images/logo.png