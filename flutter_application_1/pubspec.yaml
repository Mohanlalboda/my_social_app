flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/images/app-icon.png" 
  min_sdk_android: 21

flutter:
