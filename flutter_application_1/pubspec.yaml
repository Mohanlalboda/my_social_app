name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  image_picker: ^1.2.1
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_database: ^12.1.4
  timeago: ^3.7.1
  google_fonts: ^8.0.2
  cached_video_player_plus: 4.1.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  file_picker: ^8.1.2
  firebase_app_check: ^0.4.1+5
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0
  http: ^1.6.0
  googleapis_auth: ^2.0.0
  visibility_detector: ^0.4.0+2
  record: ^6.2.0
  audioplayers: ^6.6.0
  permission_handler: ^11.3.0
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.2
  video_trimmer: ^5.0.0
  image_cropper: 12.1.1
  video_thumbnail: ^0.5.6
  camera: ^0.12.0+1
  geolocator: ^14.0.2
  marquee: ^2.2.3
  photo_view: ^0.14.0
  google_mobile_ads: ^5.1.0

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


# 🌟 పక్కాగా ఫిట్ అయ్యే సెట్టింగ్స్ (Adaptive Icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"
  adaptive_icon_background: "#FFFFFF" # 🌟 బ్యాక్‌గ్రౌండ్ వైట్ కలర్ సెట్ అవుతుంది
  adaptive_icon_foreground: "assets/images/app-icon.png" # 🌟 లోగో ముందుకి వస్తుంది
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/app-icon.png
    - assets/service/service_account.json

